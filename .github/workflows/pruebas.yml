name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bibliotecas del sistema para Qt (pantalla virtual)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar dependencias
        run: python -m pip install -r frontend/requirements.txt
      - name: Regla de capas
        working-directory: backend
        run: python -m pytest tests/test_arquitectura.py
      - name: Pruebas del backend
        working-directory: backend
        run: python -m pytest
      - name: Pruebas del frontend
        working-directory: frontend
        run: python -m pytest
      - name: Demostración de punta a punta
        working-directory: backend
        run: python -m clinican.demo
