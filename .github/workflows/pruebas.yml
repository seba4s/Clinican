name: Pruebas

# Corre las pruebas del backend, incluidas las funciones de aptitud
# (tests/test_arquitectura.py, test_carreras.py, test_rendimiento.py), en cada cambio.
on:
  push:
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bibliotecas del sistema para Qt (pantalla virtual)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Regla de capas
        run: python -m pytest tests/test_arquitectura.py
      - name: Todas las pruebas
        run: python -m pytest
      - name: Demostración de punta a punta
        run: python -m clinican.demo
